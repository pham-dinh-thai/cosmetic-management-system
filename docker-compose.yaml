services:
  postgres:
    image: postgres:16-alpine
    container_name: cosmetic-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTHORIZATION_DB_PASSWORD: ${AUTHORIZATION_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  sync-users:
    image: postgres:16-alpine
    command: ["sh", "/scripts/sync-users.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTHORIZATION_DB_PASSWORD: ${AUTHORIZATION_DB_PASSWORD}
    volumes:
      - ./docker/postgres/sync-users.sh:/scripts/sync-users.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  migration-user:
    build: ./backend
    command: sh -c "npx mikro-orm migration:up"
    environment:
      NODE_OPTIONS: "-r ts-node/register"
      MIKRO_ORM_CLI_CONFIG: "./apps/user-service/mikro-orm.config.ts"
      USER_DB_HOST: ${USER_DB_HOST}
      USER_DB_PORT: "${USER_DB_PORT}"
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      USER_DB_NAME: ${USER_DB_NAME}
    depends_on:
      sync-users:
        condition: service_completed_successfully

  user-service:
    build: ./backend
    command: ["node", "dist/apps/user-service/main.js"]
    environment:
      USER_DB_HOST: ${USER_DB_HOST}
      USER_DB_PORT: "${USER_DB_PORT}"
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      USER_DB_NAME: ${USER_DB_NAME}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AUTHORIZATION_SERVICE_URL: ${AUTHORIZATION_SERVICE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    ports:
      - "3001:3001"
    depends_on:
      migration-user:
        condition: service_completed_successfully

  migration-auth:
    build: ./backend
    command: sh -c "npx mikro-orm migration:up"
    environment:
      NODE_OPTIONS: "-r ts-node/register"
      MIKRO_ORM_CLI_CONFIG: "./apps/authentication-service/mikro-orm.config.ts"
      AUTH_DB_HOST: ${AUTH_DB_HOST}
      AUTH_DB_PORT: "${AUTH_DB_PORT}"
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
    depends_on:
      sync-users:
        condition: service_completed_successfully

  authentication-service:
    build: ./backend
    command: ["node", "dist/apps/authentication-service/main.js"]
    environment:
      AUTH_DB_HOST: ${AUTH_DB_HOST}
      AUTH_DB_PORT: "${AUTH_DB_PORT}"
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
    ports:
      - "3002:3002"
    depends_on:
      migration-auth:
        condition: service_completed_successfully

  migration-authorization:
    build: ./backend
    command: sh -c "npx mikro-orm migration:up"
    environment:
      NODE_OPTIONS: "-r ts-node/register"
      MIKRO_ORM_CLI_CONFIG: "./apps/authorization-service/mikro-orm.config.ts"
      AUTHORIZATION_DB_HOST: ${AUTHORIZATION_DB_HOST}
      AUTHORIZATION_DB_PORT: "${AUTHORIZATION_DB_PORT}"
      AUTHORIZATION_DB_USER: ${AUTHORIZATION_DB_USER}
      AUTHORIZATION_DB_PASSWORD: ${AUTHORIZATION_DB_PASSWORD}
      AUTHORIZATION_DB_NAME: ${AUTHORIZATION_DB_NAME}
    depends_on:
      sync-users:
        condition: service_completed_successfully

  authorization-service:
    build: ./backend
    command: ["node", "dist/apps/authorization-service/main.js"]
    environment:
      AUTHORIZATION_DB_HOST: ${AUTHORIZATION_DB_HOST}
      AUTHORIZATION_DB_PORT: "${AUTHORIZATION_DB_PORT}"
      AUTHORIZATION_DB_USER: ${AUTHORIZATION_DB_USER}
      AUTHORIZATION_DB_PASSWORD: ${AUTHORIZATION_DB_PASSWORD}
      AUTHORIZATION_DB_NAME: ${AUTHORIZATION_DB_NAME}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    ports:
      - "3003:3003"
    depends_on:
      migration-authorization:
        condition: service_completed_successfully

  migration-department:
    build: ./backend
    command: sh -c "npx mikro-orm migration:up"
    environment:
      NODE_OPTIONS: "-r ts-node/register"
      MIKRO_ORM_CLI_CONFIG: "./apps/department-service/mikro-orm.config.ts"
      DEPARTMENT_DB_HOST: ${DEPARTMENT_DB_HOST}
      DEPARTMENT_DB_PORT: "${DEPARTMENT_DB_PORT}"
      DEPARTMENT_DB_USER: ${DEPARTMENT_DB_USER}
      DEPARTMENT_DB_PASSWORD: ${DEPARTMENT_DB_PASSWORD}
      DEPARTMENT_DB_NAME: ${DEPARTMENT_DB_NAME}
    depends_on:
      sync-users:
        condition: service_completed_successfully

  department-service:
    build: ./backend
    command: ["node", "dist/apps/department-service/main.js"]
    environment:
      DEPARTMENT_DB_HOST: ${DEPARTMENT_DB_HOST}
      DEPARTMENT_DB_PORT: "${DEPARTMENT_DB_PORT}"
      DEPARTMENT_DB_USER: ${DEPARTMENT_DB_USER}
      DEPARTMENT_DB_PASSWORD: ${DEPARTMENT_DB_PASSWORD}
      DEPARTMENT_DB_NAME: ${DEPARTMENT_DB_NAME}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      EMPLOYEE_SERVICE_URL: ${EMPLOYEE_SERVICE_URL}
    ports:
      - "3004:3004"
    depends_on:
      migration-department:
        condition: service_completed_successfully

  migration-employee:
    build: ./backend
    command: sh -c "npx mikro-orm migration:up"
    environment:
      NODE_OPTIONS: "-r ts-node/register"
      MIKRO_ORM_CLI_CONFIG: "./apps/employee-service/mikro-orm.config.ts"
      EMPLOYEE_DB_HOST: ${EMPLOYEE_DB_HOST}
      EMPLOYEE_DB_PORT: "${EMPLOYEE_DB_PORT}"
      EMPLOYEE_DB_USER: ${EMPLOYEE_DB_USER}
      EMPLOYEE_DB_PASSWORD: ${EMPLOYEE_DB_PASSWORD}
      EMPLOYEE_DB_NAME: ${EMPLOYEE_DB_NAME}
    depends_on:
      sync-users:
        condition: service_completed_successfully

  employee-service:
    build: ./backend
    command: ["node", "dist/apps/employee-service/main.js"]
    environment:
      EMPLOYEE_DB_HOST: ${EMPLOYEE_DB_HOST}
      EMPLOYEE_DB_PORT: "${EMPLOYEE_DB_PORT}"
      EMPLOYEE_DB_USER: ${EMPLOYEE_DB_USER}
      EMPLOYEE_DB_PASSWORD: ${EMPLOYEE_DB_PASSWORD}
      EMPLOYEE_DB_NAME: ${EMPLOYEE_DB_NAME}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      DEPARTMENT_SERVICE_URL: ${DEPARTMENT_SERVICE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    ports:
      - "3005:3005"
    depends_on:
      migration-employee:
        condition: service_completed_successfully

  gateway-service:
    build: ./backend
    command: ["node", "dist/apps/gateway-service/main.js"]
    environment:
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AUTHORIZATION_SERVICE_URL: ${AUTHORIZATION_SERVICE_URL}
      DEPARTMENT_SERVICE_URL: ${DEPARTMENT_SERVICE_URL}
      EMPLOYEE_SERVICE_URL: ${EMPLOYEE_SERVICE_URL}
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - authentication-service
      - authorization-service

  frontend:
    build: ./frontend

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - frontend
      - gateway-service

volumes:
  postgres-data:
