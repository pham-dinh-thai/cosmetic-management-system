services:
  postgres:
    image: postgres:16-alpine
    container_name: cosmetic-postgres
    environment:
      POSTGRES_USER: cosmetic
      POSTGRES_PASSWORD: cosmetic
      POSTGRES_DB: cosmetic_user_service
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
