        condition: service_completed_successfully

  gateway-service:
    build: ./backend
    command: ["node", "dist/apps/gateway-service/main.js"]
    environment:
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AUTHORIZATION_SERVICE_URL: ${AUTHORIZATION_SERVICE_URL}
      DEPARTMENT_SERVICE_URL: ${DEPARTMENT_SERVICE_URL}
      EMPLOYEE_SERVICE_URL: ${EMPLOYEE_SERVICE_URL}
      CUSTOMER_SERVICE_URL: ${CUSTOMER_SERVICE_URL}
      CATEGORY_SERVICE_URL: ${CATEGORY_SERVICE_URL}
      SUPPLIER_SERVICE_URL: ${SUPPLIER_SERVICE_URL}
      COSMETIC_SERVICE_URL: ${COSMETIC_SERVICE_URL}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL}
