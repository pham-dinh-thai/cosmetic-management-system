    command: sh -c "npx mikro-orm migration:up"
    environment:
      NODE_OPTIONS: "-r ts-node/register"
      MIKRO_ORM_CLI_CONFIG: "./apps/inventory-service/mikro-orm.config.ts"
      INVENTORY_DB_HOST: ${INVENTORY_DB_HOST}
      INVENTORY_DB_PORT: "${INVENTORY_DB_PORT}"
      INVENTORY_DB_USER: ${INVENTORY_DB_USER}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME}
    depends_on:
      sync-users:
        condition: service_completed_successfully

  inventory-service:
    build: ./backend
    command: ["node", "dist/apps/inventory-service/main.js"]
