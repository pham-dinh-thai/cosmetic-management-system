      - "3000:3000"
    depends_on:
      - user-service
      - authentication-service
      - authorization-service
      - category-service
      - supplier-service
      - cosmetic-service
      - inventory-service

  frontend:
    build: ./frontend

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - frontend
      - gateway-service

volumes:
  postgres-data:
