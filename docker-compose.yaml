    environment:
      COSMETIC_DB_HOST: ${COSMETIC_DB_HOST}
      COSMETIC_DB_PORT: "${COSMETIC_DB_PORT}"
      COSMETIC_DB_USER: ${COSMETIC_DB_USER}
      COSMETIC_DB_PASSWORD: ${COSMETIC_DB_PASSWORD}
