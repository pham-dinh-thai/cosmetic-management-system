limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10m;

    # Docker embedded DNS. Dung bien upstream de nginx resolve lai ten
    # service dinh ky, tranh giu IP cu sau khi container duoc recreate
    # (khac phuc loi 502 Bad Gateway).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream http://gateway-service:3000;
    set $frontend_upstream http://frontend:80;

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/uploads {
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/uploads/ {
        alias /var/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/ {
        limit_req zone=general burst=50 nodelay;
        limit_req_status 429;

        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
    }
}
